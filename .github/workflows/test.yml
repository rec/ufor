name: Cross-platform tests

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen --no-editable
      - name: Test parallel default
        run: uv run --no-sync pytest -q

  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        rust: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - name: Test locked workspace
        run: cargo +${{ matrix.rust }} test --workspace --locked
      - name: Check formatting
        run: cargo +${{ matrix.rust }} fmt --all --check
      - name: Check Clippy
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --all-features --locked -- -D warnings

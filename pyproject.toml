[project]
name = "ufor"
version = "0.2.0"
description = "🛸 universal Format: portable definitions for time-based data 🛸"
readme = "README.md"
license = "MIT"
authors = [{name = "Tom Ritchford", email = "tom@swirly.com"}]
requires-python = ">=3.13"
classifiers = ["Programming Language :: Python :: 3.15"]
dependencies = [
    "pydantic>=2.13.4",
    "reccy",
    "tomlkit>=0.15.1",
]

[dependency-groups]
dev = ["pytest", "pytest-xdist", "ruff", "ty", "pyupgrade"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-n auto --dist=worksteal"

[tool.uv.sources]
reccy = { git = "ssh://git@github.com/rec/reccy.git", branch = "main" }

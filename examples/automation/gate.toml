format = "recs"
version = 3
kind = "automation"
name = "gate"
title = "Logical gate"

[[timebases]]
name = "milliseconds"
[timebases.rate]
numerator = 1000

[[outputs]]
name = "control"
binding = { control = true }
stream = { family = "control", timebase = "milliseconds", quantity = "gate", unit = "logical", scope = "part" }

[body]
quantity = "gate"
unit = "logical"
scope = "part"
default = false
[body.target]
name = "light"
parameter = "enabled"

[[body.curves]]
name = "switch"
unit = "logical"
interpolation = "hold"
knots = [{ tick = 1000, value = true }, { tick = 3000, value = false }]

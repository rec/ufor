format = "recs"
version = 3
kind = "automation"
name = "fade"
title = "Fade in a recording"

[timebase]
name = "milliseconds"
[timebase.rate]
numerator = 1000

[body]
quantity = "gain"
unit = "ratio"
scope = "part"
default = 0.25
[body.target]
name = "recording"
parameter = "gain"

[[body.curves]]
name = "fade"
unit = "ratio"
interpolation = "linear"
knots = [{ tick = 1000, value = 0.0 }, { tick = 3000, value = 1.0 }]

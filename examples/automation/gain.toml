format = "recs"
version = 4
kind = "automation"
name = "fade"
title = "Fade in a recording"

[[timebases]]
name = "milliseconds"
[timebases.rate]
numerator = 1000

[[outputs]]
name = "control"
binding = { control = true }
stream = { family = "control", timebase = "milliseconds", quantity = "gain", unit = "ratio", scope = "part" }

[body]
quantity = "gain"
unit = "ratio"
scope = "part"
default = 0.25
[body.target]
name = "recording"
parameter = "gain"

[[body.curves]]
name = "fade"
unit = "ratio"
interpolation = "linear"
at = 1000
initial = 0.0
segments = [{ duration = 2000, to = 1.0 }]
